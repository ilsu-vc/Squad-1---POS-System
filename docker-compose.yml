services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - INVENTORY_SERVICE_URL=http://inventory-service:4002
      - AUTH_SERVICE_URL=http://auth-service:4001
      - TRANSACTION_SERVICE_URL=http://transaction-service:4007
      - REPORTING_SERVICE_URL=http://reporting-service:4004
      - ROLE_SERVICE_URL=http://role-service:4005
      - RECEIPT_SERVICE_URL=http://receipt-service:4006
      - FRONTEND_URL=http://frontend:3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
      - reporting-service
      - role-service
      - receipt-service
      - transaction-service
      - frontend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4001
      - INVENTORY_SERVICE_URL=http://inventory-service:4002
      - SALES_SERVICE_URL=http://sales-service:4003
      - REPORTING_SERVICE_URL=http://reporting-service:4004
      - ROLE_SERVICE_URL=http://role-service:4005
      - RECEIPT_SERVICE_URL=http://receipt-service:4006
      - TRANSACTION_SERVICE_URL=http://transaction-service:4007
    env_file:
      - .env
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
      - reporting-service
      - role-service
      - receipt-service
      - transaction-service

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
    env_file:
      - .env

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  sales-service:
    build:
      context: ./services/sales-service
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - INVENTORY_SERVICE_URL=http://inventory-service:4002
    env_file:
      - .env

  reporting-service:
    build:
      context: ./services/reporting-service
      dockerfile: Dockerfile
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  role-service:
    build:
      context: ./services/role-service
      dockerfile: Dockerfile
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
    env_file:
      - .env

  receipt-service:
    build:
      context: ./services/receipt-service
      dockerfile: Dockerfile
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
    env_file:
      - .env

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    ports:
      - "4007:4007"
    environment:
      - PORT=4007
      - INVENTORY_SERVICE_URL=http://inventory-service:4002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
