version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - SALES_SERVICE_URL=http://sales-service:4003
      - REPORTING_SERVICE_URL=http://reporting-service:4004
      - ROLE_SERVICE_URL=http://role-service:4005
      - RECEIPT_SERVICE_URL=http://receipt-service:4006
    env_file:
      - .env
    depends_on:
      - auth-service
      - product-service
      - sales-service
      - reporting-service
      - role-service
      - receipt-service

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
    env_file:
      - .env

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
    env_file:
      - .env

  sales-service:
    build:
      context: ./services/sales-service
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
    env_file:
      - .env

  reporting-service:
    build:
      context: ./services/reporting-service
      dockerfile: Dockerfile
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
    env_file:
      - .env

  role-service:
    build:
      context: ./services/role-service
      dockerfile: Dockerfile
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
    env_file:
      - .env

  receipt-service:
    build:
      context: ./services/receipt-service
      dockerfile: Dockerfile
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
    env_file:
      - .env
