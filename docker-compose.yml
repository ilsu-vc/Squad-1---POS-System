# ──────────────────────────────────────────────
# docker-compose.yml — Squad-1 POS Microservices
# ──────────────────────────────────────────────
# Run:  docker compose up --build
# Stop: docker compose down

services:

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - WATCHPACK_POLLING=true
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - SALES_SERVICE_URL=http://sales-service:4003
      - REPORTING_SERVICE_URL=http://reporting-service:4004
      - ROLE_SERVICE_URL=http://role-service:4005
      - RECEIPT_SERVICE_URL=http://receipt-service:4006
    depends_on:
      - auth-service
      - product-service
      - sales-service
      - reporting-service
      - role-service
      - receipt-service

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - PORT=4001

  # ── Product Service ────────────────────────────────────────────────────────
  product-service:
    build: ./services/product-service
    ports:
      - "4002:4002"
    env_file:
      - .env
    environment:
      - PORT=4002

  # ── Sales Service ──────────────────────────────────────────────────────────
  sales-service:
    build: ./services/sales-service
    ports:
      - "4003:4003"
    env_file:
      - .env
    environment:
      - PORT=4003

  # ── Reporting Service ──────────────────────────────────────────────────────
  reporting-service:
    build: ./services/reporting-service
    ports:
      - "4004:4004"
    env_file:
      - .env
    environment:
      - PORT=4004

  # ── Role Service ───────────────────────────────────────────────────────────
  role-service:
    build: ./services/role-service
    ports:
      - "4005:4005"
    env_file:
      - .env
    environment:
      - PORT=4005

  # ── Receipt Service ────────────────────────────────────────────────────────
  receipt-service:
    build: ./services/receipt-service
    ports:
      - "4006:4006"
    env_file:
      - .env
    environment:
      - PORT=4006
