services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_ERLANG_COOKIE=POS_RABBITMQ_SECRET_COOKIE
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3031:3031"
    environment:
      - PORT=3031
      - POS_GATEWAY_INVENTORY_SERVICE_URL=http://inventory-service:3033
      - POS_GATEWAY_AUTH_SERVICE_URL=http://auth-service:3032
      - POS_GATEWAY_TRANSACTION_SERVICE_URL=http://transaction-service:3038
      - POS_GATEWAY_REPORTING_SERVICE_URL=http://reporting-service:3035
      - POS_GATEWAY_ROLE_SERVICE_URL=http://role-service:3036
      - POS_GATEWAY_RECEIPT_SERVICE_URL=http://receipt-service:3034
      - POS_GATEWAY_FRONTEND_URL=http://frontend:3030
      - NEXT_PUBLIC_POS_GATEWAY_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_POS_GATEWAY_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
      - reporting-service
      - role-service
      - receipt-service
      - transaction-service
      - frontend

  frontend:
    build:
      context: ../pos-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: always
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - POS_FRONTEND_AUTH_SERVICE_URL=http://auth-service:3032
      - POS_FRONTEND_INVENTORY_SERVICE_URL=http://inventory-service:3033
      - POS_FRONTEND_SALES_SERVICE_URL=http://sales-service:3037
      - POS_FRONTEND_REPORTING_SERVICE_URL=http://reporting-service:3035
      - POS_FRONTEND_ROLE_SERVICE_URL=http://role-service:3036
      - POS_FRONTEND_RECEIPT_SERVICE_URL=http://receipt-service:3034
      - POS_FRONTEND_TRANSACTION_SERVICE_URL=http://transaction-service:3038
    env_file:
      - .env
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
      - reporting-service
      - role-service
      - receipt-service
      - transaction-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3032:3032"
    environment:
      - PORT=3032
    env_file:
      - ./auth-service/.env

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3033:3033"
    environment:
      - PORT=3033
      - POS_INVENTORY_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - ./inventory-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  sales-service:
    build:
      context: ./sales-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3037:3037"
    environment:
      - PORT=3037
      - POS_SALES_INVENTORY_SERVICE_URL=http://inventory-service:3033
    env_file:
      - .env

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3035:3035"
    environment:
      - PORT=3035
      - POS_REPORTING_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - ./reporting-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  role-service:
    build:
      context: ./role-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3036:3036"
    environment:
      - PORT=3036
    env_file:
      - ./role-service/.env

  receipt-service:
    build:
      context: ./receipt-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3034:3034"
    environment:
      - PORT=3034
    env_file:
      - ./receipt-service/.env

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3038:3038"
    environment:
      - PORT=3038
      - POS_TRANSACTION_INVENTORY_SERVICE_URL=http://inventory-service:3033
      - POS_TRANSACTION_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    env_file:
      - ./transaction-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ── Pact Broker (Contract Testing) ──────────────────────────────────────────
  pact-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=pact
      - POSTGRES_PASSWORD=${PACT_BROKER_DB_PASSWORD:-pact_pass}
      - POSTGRES_DB=pact_broker
    volumes:
      - pact-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 10s
      timeout: 5s
      retries: 5

  pact-broker:
    image: pactfoundation/pact-broker:latest
    ports:
      - "9292:9292"
    environment:
      - PACT_BROKER_DATABASE_URL=postgresql://pact:${PACT_BROKER_DB_PASSWORD:-pact_pass}@pact-postgres:5432/pact_broker
      - PACT_BROKER_BASIC_AUTH_USERNAME=${PACT_BROKER_USERNAME:-pact_user}
      - PACT_BROKER_BASIC_AUTH_PASSWORD=${PACT_BROKER_PASSWORD:-pact_pass}
      - PACT_BROKER_ALLOW_PUBLIC_READ=true
      - PACT_BROKER_LOG_LEVEL=INFO
    depends_on:
      pact-postgres:
        condition: service_healthy

  # ── InfluxDB (k6 Metrics Storage) ────────────────────────────────────────────
  influxdb:
    image: influxdb:1.8-alpine
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_MAX_BODY_SIZE=0
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana (Load Test Dashboard) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  pact-postgres-data:
  influxdb-data:
  grafana-data:
  rabbitmq-data:
