name: POS Mobile Tests

on:
  push:
    branches:
      - pos-mobile
      - develop
      - test
  pull_request:
    branches:
      - develop
      - test
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.pos-mobile.config.js'
      - '.github/workflows/pos-mobile-tests.yml'
  workflow_dispatch:

concurrency:
  group: pos-mobile-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Jest Expo unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run POS mobile tests
        run: npm run test:pos-mobile

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: pos-mobile-coverage
          path: coverage/pos-mobile
