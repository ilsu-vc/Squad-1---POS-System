name: Integration Tests (API Edge Cases)

# SCRUM 312: POS-S4-015-T4 - Integrate into CI pipeline with < 60s target
# Runs on every push and PR to ensure no regressions in critical business logic.

on:
  push:
    branches: [ "main", "develop", "ConvMicro-Branch" ]
  pull_request:
    branches: [ "main", "develop", "ConvMicro-Branch" ]

jobs:
  integration-test:
    name: Run Jest Integration Tests (< 60s)
    runs-on: ubuntu-latest

    # Setup environment variables so the tests can hit Supabase
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TRANSACTION_SERVICE_URL: http://localhost:4007
      AUTH_SERVICE_URL: http://localhost:4001

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Create .env file for Docker
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "PORT=4007" >> .env

      - name: Start Docker Services
        run: |
          docker compose -f docker-compose.yml up -d auth-service transaction-service api-gateway pact-postgres
          # Wait for services to be healthy
          sleep 15
          docker compose ps

      - name: Run Integration Tests
        # Fails the pipeline if tests fail or if they take longer than 60 seconds (enforced by Jest timeout if configured, or general speed)
        run: npm run test:integration

      - name: Docker Logs on Failure
        if: failure()
        run: docker compose logs auth-service transaction-service

      - name: Teardown Services
        if: always()
        run: docker compose down
